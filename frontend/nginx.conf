server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 60m;

    # PDF.js loads its worker as an ES module. Alpine's default MIME table
    # does not map .mjs, which makes browsers reject the worker response.
    # Keep this scoped so the inherited MIME mappings for every other asset
    # remain intact.
    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The backend trusts this proxy in Docker Compose. Overwrite, rather
        # than append, client-supplied forwarding headers so rate limiting
        # cannot be bypassed with a forged X-Forwarded-For value.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 960s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
